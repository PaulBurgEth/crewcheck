<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrewCheck viz preview</title>
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/viz.css">
<style>
  .grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .grid>*,.card{min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .card h2{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
  #body{height:640px}
</style>
</head>
<body>
<main>
  <div class="grid">
    <section class="card"><h2>Body (day 120) <span id="sel"></span></h2><div id="body"></div></section>
    <div style="display:grid;gap:20px;align-content:start">
      <section class="card"><h2>Signal: ISS</h2><div id="sig-iss"></div></section>
      <section class="card"><h2>Signal: Moon</h2><div id="sig-moon"></div></section>
      <section class="card"><h2>Signal: Mars</h2><div id="sig-mars"></div></section>
      <section class="card"><h2>Nodes</h2>
        <div id="n-none"></div><div id="n-self"></div><div id="n-crew"></div><div id="n-earth"></div>
      </section>
      <section class="card"><h2>Timeline</h2><div id="tl"></div></section>
      <section class="card"><h2>Rings</h2><div id="rings"></div></section>
      <section class="card"><h2>Live</h2><div id="live"></div></section>
    </div>
  </div>
</main>
<script type="module">
import { renderBody } from '../js/viz/body.js';
import { renderSignal } from '../js/viz/signal.js';
import { renderNodes } from '../js/viz/nodes.js';
import { renderTimeline } from '../js/viz/timeline.js';
import { renderRings } from '../js/viz/rings.js';
import { renderLive } from '../js/viz/live.js';

const systems = { heart:'yellow', lungs:'green', eyes:'green', sleep:'yellow', mind:'yellow', bones:'green', metabolic:'green' };
let selected = 'heart';
const bodyEl = document.getElementById('body');
function drawBody() {
  renderBody(bodyEl, { systems, selected, onSelect: (id) => { selected = id; document.getElementById('sel').textContent = '· ' + id; drawBody(); } });
}
drawBody();

renderSignal(document.getElementById('sig-iss'), { missionLabel: 'ISS', oneWayMin: 0, sent: true });
renderSignal(document.getElementById('sig-moon'), { missionLabel: 'Moon', oneWayMin: 1.3 / 60, sent: true });
renderSignal(document.getElementById('sig-mars'), { missionLabel: 'Mars', oneWayMin: 20, sent: true, replyLabel: 'Reply queued' });

renderNodes(document.getElementById('n-none'), { tier: 'none' });
renderNodes(document.getElementById('n-self'), { tier: 'self' });
renderNodes(document.getElementById('n-crew'), { tier: 'crew', alsoNotify: ['self'] });
renderNodes(document.getElementById('n-earth'), { tier: 'earth', alsoNotify: ['crew'] });

const statuses = Array.from({ length: 180 }, (_, i) => {
  const d = i + 1;
  if (d >= 30 && d <= 32) return 'grey';
  if ((d >= 58 && d <= 75) || (d >= 98 && d <= 120) || (d >= 153 && d <= 160)) return 'yellow';
  if (d >= 148 && d <= 152) return 'red';
  return 'green';
});
renderTimeline(document.getElementById('tl'), {
  days: 180, day: 120, statuses,
  events: [
    { day: 60, label: 'Missed workouts' }, { day: 100, label: 'Sleep drift' },
    { day: 121, label: 'Countermeasure' }, { day: 150, label: 'Solar particle event' },
  ],
  onChange: (d) => console.log('day', d),
});

renderRings(document.getElementById('rings'), {
  size: 140, center: '82',
  rings: [
    { value: 0.8, color: 'var(--green)', label: 'Exercise' },
    { value: 0.6, color: 'var(--blue)', label: 'Sleep' },
    { value: 0.35, color: 'var(--yellow)', label: 'Check-ins' },
  ],
});

const live = renderLive(document.getElementById('live'), { label: 'Heart rate', unit: 'bpm', color: 'var(--red)' });
let t = 0;
setInterval(() => { t += 1; live.push(Math.round(64 + 6 * Math.sin(t / 5) + Math.random() * 3)); }, 700);
</script>
</body>
</html>
