<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrewCheck</title>
<meta name="description" content="CrewCheck: crew health when Earth is far away. Educational prototype, synthetic data, not a medical device.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/viz.css">
<link rel="stylesheet" href="css/trends.css">
<link rel="stylesheet" href="css/checkin.css">
<link rel="stylesheet" href="css/earth.css">
<link rel="stylesheet" href="css/sources.css">
<link rel="stylesheet" href="css/blocks.css">
</head>
<body>
<header class="top">
  <div class="brand">CrewCheck <span class="sub">Crew health when Earth is far away</span></div>
  <div class="disclaim">Synthetic data · Not a medical device</div>
</header>
<main id="app"><p class="boot">Loading…</p></main>
<footer class="foot">Synthetic data · Educational prototype · Not a medical device</footer>
<script>
// If any app module fails to load (network error, 503), show a reload button instead of a blank page.
window.ccBootFail = function () {
  var m = document.getElementById('app');
  if (!m || window.ccBooted) return;
  m.innerHTML = '<div class="boot-fail"><p>Part of the app did not load.</p><button type="button" onclick="location.reload()">Reload</button></div>';
};
setTimeout(function () { if (!window.ccBooted) window.ccBootFail(); }, 12000);
</script>
<script type="module" src="js/app.js" onerror="ccBootFail()"></script>
</body>
</html>
